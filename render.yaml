services:
  - type: web
    name: cardiolens
    runtime: python
    plan: free
    buildCommand: "pip install -r requirements-api.txt"
    startCommand: "uvicorn api.main:app --host 0.0.0.0 --port $PORT --workers 1"
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9

